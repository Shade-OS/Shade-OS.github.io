# ShadeOS sitesini derleyip GitHub Pages'e yayimlar.
#
# Neden Actions ile: site Vite + React + SSR on-render kullaniyor, yani
# depodaki kaynaklar dogrudan servis edilemez; once derlenmesi gerekiyor.
# Pages'in "branch" kaynagi bunu yapamaz, "GitHub Actions" kaynagi yapar.
#
# Ozel alan adi public/CNAME dosyasindan gelir; Vite public/ altini oldugu
# gibi dist/ icine kopyalar, boylece her yayimda CNAME yerinde kalir.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda tek yayim; yeni push gelirse devam edeni iptal etme -- yarim
# kalmis bir yayim siteyi bozuk birakabilir.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # tsc --noEmit + vite build + SSR paketi + on-render (package.json)
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
